name: mypoly
description: "MyPOLY"
publish_to: 'none'
version: 1.0.0+18

environment:
  sdk: ^3.10.7

dependencies:
  flutter:
    sdk: flutter

  # State
  hooks_riverpod: ^3.1.0
  flutter_hooks: ^0.21.3+1
  riverpod_annotation: ^4.0.0

  # API
  retrofit: ^4.7.3
  dio: ^5.9.0

  # Model
  freezed_annotation: ^3.1.0
  json_annotation: ^4.11.0

  # Route
  auto_route: ^11.1.0

  # Widget
  flutter_screenutil: ^5.9.3
  loader_overlay: ^5.0.0
  skeletonizer: ^2.1.2
  flutter_svg: ^2.2.3
  cached_network_image_ce: ^4.4.0
  lottie: ^3.3.2
  flutter_html: ^3.0.0
  infinite_scroll_pagination: ^5.1.1
  table_calendar: ^3.2.0
  gradient_borders: ^1.0.4
  fl_chart: ^1.2.0

  # Native
  flutter_native_splash: ^2.4.7

  # Util
  flutter_dotenv: ^6.0.0
  collection: ^1.19.1
  intl: ^0.20.0
  keyboard_detection: ^0.8.1
  package_info_plus: ^9.0.0
  url_launcher: ^6.3.2

  # Native Util
  connectivity_plus: ^7.0.0
  shake_gesture: ^2.1.0

  # Social
  kakao_flutter_sdk_user: ^1.10.0
  sign_in_with_apple: ^7.0.1
  google_sign_in: ^7.2.0

  # Firebase
  firebase_core: ^4.4.0
  firebase_analytics: ^12.1.3

  # Storage
  flutter_secure_storage: ^10.0.0
  shared_preferences: ^2.5.4

  # Log
  talker_flutter: ^5.1.16
  talker_dio_logger: ^5.1.16
  talker_riverpod_logger: ^5.1.16

dev_dependencies:
  flutter_test:
    sdk: flutter

  # Runner
  build_runner: ^2.15.0

  # Route
  auto_route_generator: 10.4.0

  # State
  riverpod_generator: ^4.0.3

  # API
  retrofit_generator: ^10.0.0

  # Model
  freezed: ^3.2.5
  json_serializable: ^6.13.0

  # Lint
  flutter_lints: ^6.0.0
  riverpod_lint: ^3.1.0

  # CLI
  melos: ^7.3.0
  spider: ^4.2.3
  change_app_package_name: ^1.5.0
  flutter_launcher_icons: ^0.14.4
  openapi_generator_cli: ^7.0.0
  dotenv: ^4.2.0
  dart_pubspec_licenses: ^3.2.0

flutter:
  config:
    enable-swift-package-manager: false

  uses-material-design: true

  assets:
    - .env.dev
    - .env.prod
    - assets/svg/
    - assets/webp/
    - assets/lottie/
    
  fonts:
    - family: Pretendard
      fonts:
        - asset: assets/font/Pretendard-Thin.ttf
          weight: 100
        - asset: assets/font/Pretendard-ExtraLight.ttf
          weight: 200
        - asset: assets/font/Pretendard-Light.ttf
          weight: 300
        - asset: assets/font/Pretendard-Regular.ttf
          weight: 400
        - asset: assets/font/Pretendard-Medium.ttf
          weight: 500
        - asset: assets/font/Pretendard-SemiBold.ttf
          weight: 600
        - asset: assets/font/Pretendard-Bold.ttf
          weight: 700
        - asset: assets/font/Pretendard-ExtraBold.ttf
          weight: 800
        - asset: assets/font/Pretendard-Black.ttf
          weight: 900
    
melos:
  useRootAsPackage: true

  scripts:
    clean:
      steps:
        - fvm flutter clean
        - fvm flutter pub get
        - melos gen:oss
        - test "$(uname)" = "Darwin" && fvm flutter precache --ios && cd ios && pod install && cd .. || true
        - fvm dart run spider build
        - fvm dart run build_runner build

    watch:
      steps:
        - fvm dart run build_runner watch

    spider:
      steps:
        - fvm dart run spider build --watch

    gen:
      steps:
        - fvm dart run scripts/generate_openapi.dart

    gen:oss:
      steps:
        - fvm dart run dart_pubspec_licenses:generate

    flutterfire:configure:
      steps:
        - flutterfire configure --project=poly-wave --out=lib/firebase_options_dev.dart --ios-bundle-id=kr.kro.mypoly.app.dev --android-app-id=kr.kro.mypoly.app.dev -y
        - flutterfire configure --project=poly-wave --out=lib/firebase_options_prod.dart --ios-bundle-id=kr.kro.mypoly.app --android-app-id=kr.kro.mypoly.app -y

    deploy:dev:
      steps:
        - melos clean
        - cd android && fastlane deploy_firebase_dev && cd ..
        - cd ios && fastlane deploy_firebase_dev && cd ..

    deploy:store:
      steps:
        - melos clean
        - fvm flutter build aab --release --flavor prod
        - fvm flutter build ipa --release --flavor prod
